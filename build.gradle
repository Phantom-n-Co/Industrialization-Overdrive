plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id
base {
    archivesName = artifact_name
}

repositories {
    mavenLocal()
    mavenCentral()

    maven {
        name = "Modmaven"
        url = "https://modmaven.dev"
        content {
            // GrandPower
            includeGroup "dev.technici4n"
            // Modern Industrialization
            includeGroup "aztech"
            // Tesseract
            includeGroup "net.swedz"
            // Almost Unified
            includeGroup "com.almostreliable.mods"
        }
    }
    maven {
        name = "shedaniel"
        url = "https://maven.shedaniel.me"
        content {
            includeGroup "me.shedaniel.cloth"
        }
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
        content {
            // EMI
            includeGroup "dev.emi"
        }
    }
    maven {
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    maven {
        url = 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
        }
    }
}

dependencies {
    implementation("aztech:Modern-Industrialization:${modern_industrialization_version}")
    implementation("dev.technici4n:GrandPower:${grandpower_version}")
    implementation("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}")
    implementation("net.swedz:tesseract-api-neoforge:${tesseract_version}-${minecraft_version}")
    implementation("org.appliedenergistics:guideme:${guideme_version}")
    compileOnly("net.swedz:extended-industrialization:${extended_industrialization_version}-${minecraft_version}")
    compileOnly("org.appliedenergistics:appliedenergistics2:${ae2_version}")
    compileOnly("com.almostreliable.mods:almostunified-neoforge:${project.minecraft_version}-${project.au_version}:api")
    compileOnly("curse.maven:yet-another-industrialization-1358516:8869989")

    //compileOnly("net.swedz:mi-tweaks:${mi_tweaks_version}-${minecraft_version}")
    //runtimeOnly("net.swedz:mi-tweaks:${mi_tweaks_version}-${minecraft_version}")

    runtimeOnly("net.swedz:extended-industrialization:${extended_industrialization_version}-${minecraft_version}")
    runtimeOnly("org.appliedenergistics:appliedenergistics2:${ae2_version}")
    runtimeOnly("dev.emi:emi-neoforge:${emi_version}+${minecraft_version}")
    runtimeOnly("curse.maven:better-advanced-tooltips-1637623:8576077")
    runtimeOnly("curse.maven:jade-324717:8591319")
    runtimeOnly("curse.maven:kotlin-for-forge-351264:8335665") // YAI uses kotlin.... >:(
    runtimeOnly("curse.maven:yet-another-industrialization-1358516:8869989")

    testImplementation(platform("org.junit:junit-bom:5.11.4"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

tasks.named('jar') {
    from "LICENSE"
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.register('sourceJar', Jar) {
    archiveClassifier.set("sources")
    from sourceSets.main.allJava
    from "LICENSE"
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = project.artifact_name

            artifact(sourceJar) {
                classifier "sources"
            }
        }
    }

    repositories {
        mavenLocal()

        maven {
            credentials {
                username = System.getenv("MODMAVEN_USERNAME")
                password = System.getenv("MODMAVEN_PASSWORD")
            }
            name = "modmaven"
            url = "https://modmaven.dev/artifactory/local-releases/"
        }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    validateAccessTransformers = true
    accessTransformers = [
            "src/main/resources/${mod_id}.accesstransformer.cfg"
    ]

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'

            sourceSet = project.sourceSets.main
        }

        client {
            client()

            gameDirectory.set(project.getLayout().getProjectDirectory().dir('runs/client'))

            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id

            systemProperty 'mixin.env.remapRefMap', 'true'
            systemProperty 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
            systemProperty 'mixin.debug.export', 'true'
            systemProperty 'mixin.debug.verbose', 'true'

            systemProperty 'guideme.modern_industrialization.book.sources', file("guidebook").absolutePath
        }

        server {
            server()

            gameDirectory.set(project.getLayout().getProjectDirectory().dir('runs/server'))

            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            programArgument '--nogui'
        }

        data {
            data()

            gameDirectory.set(project.getLayout().getProjectDirectory().dir('runs/data'))

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version                     : minecraft_version,
            minecraft_version_range               : minecraft_version_range,
            neo_version                           : neo_version,
            neo_version_range                     : neo_version_range,
            loader_version_range                  : loader_version_range,
            mod_id                                : mod_id,
            mod_name                              : mod_name,
            mod_version                           : version,
            mod_authors                           : mod_authors,
            mod_description                       : mod_description,
            mod_license                           : mod_license,
            mod_github                            : mod_github,
            mod_credits                           : mod_credits,
            modern_industrialization_version_range: modern_industrialization_version_range,
            tesseract_version_range               : tesseract_version_range,
            guideme_version_range                 : guideme_version_range,
            ae2_version_range                     : ae2_version_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

processResources {
    duplicatesStrategy = 'exclude'
    exclude(".cache")
}

tasks.jar {
    exclude("**/datagen/**")

    from('guidebook') {
        into('assets/modern_industrialization/mi_guidebook')
    }
}

def releaseType = "stable"
if (mod_version.toLowerCase().contains("alpha")) {
    releaseType = "alpha"
} else if (mod_version.toLowerCase().contains("beta")) {
    releaseType = "beta"
}

publishMods {
    file = tasks.named("jar").flatMap { it.archiveFile }
    version = project.version
    changelog = providers.environmentVariable("CHANGELOG").orElse("See ${mod_github}/releases")
    type = me.modmuss50.mpp.ReleaseType.of(releaseType)
    displayName = "${mod_name} ${project.version}"
    modLoaders.add("neoforge")
    dryRun = providers.gradleProperty("publishDryRun").isPresent()

    def shared = { platform ->
        platform.minecraftVersions.add(minecraft_version)
        platform.requires("modern-industrialization", "guideme")
        platform.optional("extended-industrialization", "emi", "jade", "yet-another-industrialization")
    }

    curseforge {
        projectId = curseforge_project
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        javaVersions.add(JavaVersion.VERSION_21)
        client = true
        server = true
        shared it
        // Slugs differ from Modrinth's
        requires("tesseract-api-neoforge")
        optional("applied-energistics-2", "almost-unified")
    }

    modrinth {
        projectId = modrinth_project
        accessToken = providers.environmentVariable("MODRINTH_API_KEY")
        shared it
        requires("tesseract-api")
        optional("ae2", "almostunified")
    }
}
