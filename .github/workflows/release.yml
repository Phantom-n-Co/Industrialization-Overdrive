name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check tag matches mod_version
        run: |
          MOD_VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          if [ "$TAG" != "$MOD_VERSION" ]; then
            echo "::error::Tag '$TAG' does not match mod_version '$MOD_VERSION' in gradle.properties"
            exit 1
          fi

      - name: Mark alpha/beta as pre-release
        run: |
          case "${TAG,,}" in
            *alpha*|*beta*) gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease ;;
          esac

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build sourceJar

      - name: Attach jars to GitHub release
        run: gh release upload "$TAG" build/libs/*.jar --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish to CurseForge and Modrinth
        env:
          CHANGELOG: ${{ github.event.release.body }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_API_KEY: ${{ secrets.MODRINTH_API_KEY }}
        run: ./gradlew publishMods
